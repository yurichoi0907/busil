<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기업 위험등급 분석기</title>
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--fg:#14213d;--mut:#5b6478;--bd:#e0e5ee;--brand:#2456d6;--brand-fg:#fff;
  --good:#0e7a46;--good-bg:#e3f5ec;--warn:#9a5b00;--warn-bg:#fff1d6;--bad:#b42323;--bad-bg:#fde6e6;
  --track:#e6eaf2;--shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1320;--card:#171e2e;--fg:#e9edf6;--mut:#a3adc2;--bd:#27314a;--brand:#6d93ff;--brand-fg:#0e1320;
  --good:#4ade9a;--good-bg:#12362a;--warn:#fbbf4a;--warn-bg:#3a2c0e;--bad:#ff8a8a;--bad-bg:#3d1a1a;
  --track:#27314a;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:28px 16px 40px}
header{margin-bottom:20px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
form{display:flex;gap:10px}
input{flex:1;min-width:0;padding:14px 16px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font-size:1.1rem}
input:focus{outline:none;border-color:var(--brand)}
button{font:inherit;cursor:pointer}
.go{padding:0 24px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-fg);font-weight:700;font-size:1rem}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.chips:empty{display:none}
.chips .lbl{color:var(--mut);font-size:.85rem}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:.9rem}
.chip:hover{border-color:var(--brand)}
/* 등급 */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1.9rem}
.badge .ic{font-size:1.6rem}
.좋음{background:var(--good-bg);color:var(--good)}
.주의{background:var(--warn-bg);color:var(--warn)}
.나쁨{background:var(--bad-bg);color:var(--bad)}
.hero .meta{flex:1;min-width:220px}
.name{font-size:1.2rem;font-weight:700}
.score{font-size:.95rem;color:var(--mut);margin-bottom:8px}
.score b{color:var(--fg);font-size:1.3rem}
.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.gauge i{height:10px;border-radius:3px;background:var(--track)}
.gauge i.on{background:currentColor}
.좋음 .gauge,.gauge.좋음{color:var(--good)}
.gauge.주의{color:var(--warn)}.gauge.나쁨{color:var(--bad)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut);margin-top:4px}
h2{font-size:1.05rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.m{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--bg)}
.m .t{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.85rem}
.dots{letter-spacing:2px;font-size:1rem}
.m .v{font-size:1.5rem;font-weight:800;margin:4px 0}
.m .d{font-size:.82rem;color:var(--mut)}
.s2 .dots,.s2 .v{color:var(--good)}.s1 .dots,.s1 .v{color:var(--warn)}.s0 .dots,.s0 .v{color:var(--bad)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{color:var(--mut);font-weight:600}
td.neg{color:var(--bad)}
td.sp{width:90px;text-align:center}
.err{display:flex;gap:12px;align-items:flex-start}
.err .ic{font-size:1.4rem}
.note{color:var(--mut);font-size:.8rem;margin-top:8px}
@media(max-width:480px){h1{font-size:1.35rem}.badge{font-size:1.6rem;width:100%;justify-content:center}.go{padding:0 16px}}
</style>
</head>
<body>
<main>
<header>
  <h1>기업 위험등급 분석기</h1>
  <p class="sub">기업 이름을 입력하면 최근 5개년 재무를 분석해 위험등급을 알려드립니다.</p>
</header>
<section class="card" aria-label="기업 검색">
  <form id="f"><input id="q" placeholder="기업 이름 (예: 삼성전자)" autocomplete="off" aria-label="기업 이름"><button class="go">분석</button></form>
  <div class="chips" id="hist" aria-label="최근 조회"></div>
</section>
<div id="out" aria-live="polite"></div>
<p class="note">※ 내장 샘플 데이터(근사치, 단위: 조원)이며 투자 판단용이 아닙니다.</p>
</main>
<script>
const LEVELS={GOOD:"좋음",MID:"주의",BAD:"나쁨"};
const ICON={"좋음":"✓","주의":"!","나쁨":"✕"};
// 단위: 조원 (연결 기준 근사치)
const DATA={
"삼성전자":{years:[2020,2021,2022,2023,2024],
 rev:[236.8,279.6,302.2,258.9,300.9],op:[36.0,51.6,43.4,6.6,32.7],ni:[26.4,39.9,55.7,15.5,34.5],
 assets:[378.2,426.6,448.4,455.9,514.5],liab:[102.3,121.4,93.7,92.2,112.3],equity:[275.9,305.1,354.7,363.7,402.2],
 ca:[198.2,218.5,218.5,195.9,227.1],cl:[75.7,88.1,78.3,75.3,93.3]},
"SK하이닉스":{years:[2020,2021,2022,2023,2024],
 rev:[31.9,43.0,44.6,32.8,66.2],op:[5.0,12.4,6.8,-7.7,23.5],ni:[4.8,9.6,2.2,-9.1,19.8],
 assets:[80.3,95.2,110.1,109.1,130.0],liab:[28.0,32.4,45.0,49.0,50.0],equity:[52.3,62.8,65.1,60.1,80.0],
 ca:[21.0,25.6,24.9,28.0,38.0],cl:[11.3,13.5,21.5,23.0,28.0]},
"현대자동차":{years:[2020,2021,2022,2023,2024],
 rev:[104.0,117.6,142.5,162.7,175.2],op:[2.4,6.7,9.8,15.1,14.2],ni:[1.4,6.0,7.9,13.1,13.6],
 assets:[224,246,276,301,330],liab:[147,161,181,195,215],equity:[77,85,95,106,115],
 ca:[90,100,110,120,130],cl:[78,86,95,102,110]},
"한국전력":{years:[2020,2021,2022,2023,2024],
 rev:[59.2,60.6,71.3,88.2,93.7],op:[4.1,-5.8,-32.6,-4.5,13.5],ni:[1.0,-5.0,-24.8,-4.5,4.2],
 assets:[205.4,213.5,226.0,227.0,225.0],liab:[146.4,161.5,196.0,203.0,187.0],equity:[59.0,52.0,30.0,24.0,38.0],
 ca:[21,22,28,27,26],cl:[31,35,48,45,43]}
};
const ALIAS={"하이닉스":"SK하이닉스","sk hynix":"SK하이닉스","현대차":"현대자동차","한전":"한국전력","kepco":"한국전력",
"삼성":"삼성전자","samsung":"삼성전자","samsung electronics":"삼성전자","005930":"삼성전자"};
const KEY="corp-risk-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const pct=n=>n.toFixed(1)+"%";
const pick=(v,a,b,hi=true)=>hi?(v>=a?2:v>=b?1:0):(v<a?2:v<b?1:0);

function analyze(name,d){
  const n=d.years.length-1;
  const debt=d.liab[n]/d.equity[n]*100, cur=d.ca[n]/d.cl[n]*100, mar=d.op[n]/d.rev[n]*100;
  const profit=d.ni.filter(x=>x>0).length;
  const cagr=(Math.pow(d.rev[n]/d.rev[0],1/n)-1)*100;
  const items=[
   {t:"부채비율",v:pct(debt),s:pick(debt,100,200,false),m:"낮을수록 안정적 (100% 미만 우수)"},
   {t:"유동비율",v:pct(cur),s:pick(cur,150,100),m:"단기 상환능력 (150% 이상 우수)"},
   {t:"영업이익률",v:pct(mar),s:pick(mar,10,5),m:"본업 수익성 (10% 이상 우수)"},
   {t:"흑자 연수",v:profit+"/"+(n+1)+"년",s:profit>=4?2:profit==3?1:0,m:"5년 중 순이익 흑자 횟수 (4회 이상 우수)"},
   {t:"매출 성장률",v:pct(cagr),s:cagr>=3?2:cagr>=0?1:0,m:"연평균 성장률 CAGR (3% 이상 우수)"}];
  const score=items.reduce((a,b)=>a+b.s,0);
  const level=score>=7?LEVELS.GOOD:score>=4?LEVELS.MID:LEVELS.BAD;
  return {name,score,level,items,d};
}

function spark(a){
  const w=80,h=24,min=Math.min(...a,0),max=Math.max(...a,0),r=max-min||1,bw=w/a.length;
  const z=h-(0-min)/r*h;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="5개년 추세">`+
   a.map((x,i)=>{const y=h-(x-min)/r*h,top=Math.min(y,z),ht=Math.max(Math.abs(y-z),1.5);
    return `<rect x="${i*bw+1.5}" y="${top}" width="${bw-3}" height="${ht}" rx="1.5" fill="${x<0?'var(--bad)':'var(--brand)'}"/>`}).join("")+`</svg>`;
}

function render(r){
  if(!r){$("out").innerHTML="";return}
  if(r.error){$("out").innerHTML=`<div class="card err"><span class="ic">⚠</span><div>${esc(r.error)}</div></div>`;return}
  const d=r.d, dots=s=>"●".repeat(s)+"○".repeat(2-s);
  const rows=[["매출",d.rev],["영업이익",d.op],["순이익",d.ni],["자산",d.assets],["부채",d.liab],["자본",d.equity]]
   .map(([k,a])=>`<tr><td>${k}</td>${a.map(x=>`<td class="${x<0?'neg':''}">${x.toFixed(1)}</td>`).join("")}<td class="sp">${spark(a)}</td></tr>`).join("");
  $("out").innerHTML=`
  <section class="card"><div class="hero">
    <div class="badge ${r.level}"><span class="ic" aria-hidden="true">${ICON[r.level]}</span>${r.level}</div>
    <div class="meta"><div class="name">${esc(r.name)}</div>
      <div class="score">종합 <b>${r.score}</b> / 10점</div>
      <div class="gauge ${r.level}" role="img" aria-label="종합 ${r.score}점 / 10점">${Array.from({length:10},(_,i)=>`<i class="${i<r.score?'on':''}"></i>`).join("")}</div>
      <div class="scale"><span>나쁨 0–3</span><span>주의 4–6</span><span>좋음 7–10</span></div></div>
  </div></section>
  <section class="card"><h2>판단 근거</h2><div class="grid">
    ${r.items.map(i=>`<div class="m s${i.s}"><div class="t"><span>${i.t}</span><span class="dots" aria-label="${i.s}점/2점">${dots(i.s)}</span></div><div class="v">${i.v}</div><div class="d">${i.m}</div></div>`).join("")}
  </div></section>
  <section class="card"><h2>5개년 재무 (조원)</h2><div class="wrap"><table>
    <tr><th>항목</th>${d.years.map(y=>`<th>${y}</th>`).join("")}<th style="text-align:center">추세</th></tr>${rows}</table></div></section>`;
}

function renderHist(h){
  $("hist").innerHTML=(h&&h.length?'<span class="lbl">최근 조회</span>':'')+(h||[]).map(n=>`<button type="button" class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("");
}

function run(q){
  q=q.trim(); if(!q)return;
  const norm=x=>x.toLowerCase().replace(/\s+/g,"");
  const nq=norm(q);
  const name=Object.keys(DATA).find(k=>norm(k)===nq)||Object.keys(ALIAS).map(k=>[norm(k),ALIAS[k]]).find(([k])=>k===nq)?.[1]||q;
  const s=load();
  if(!DATA[name]){s.result={error:`"${q}" 데이터가 없습니다. 현재 지원: ${Object.keys(DATA).join(", ")}`};}
  else{
    s.result=analyze(name,DATA[name]);
    s.hist=[name,...(s.hist||[]).filter(x=>x!==name)].slice(0,8);
  }
  s.q=q; save(s); render(s.result); renderHist(s.hist);
}

$("f").onsubmit=e=>{e.preventDefault();run($("q").value)};
$("hist").onclick=e=>{const n=e.target.dataset&&e.target.dataset.n;if(n){$("q").value=n;run(n)}};
const s=load(); $("q").value=s.q||"삼성전자"; render(s.result); renderHist(s.hist);
if(!s.result) run("삼성전자");
</script>
</body>
</html>
