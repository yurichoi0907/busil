*{box-sizing:border-box}

.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.scale span{padding:5px 0;text-align:center;font-size:.8rem;border-radius:6px;background:var(--track);color:var(--mut)}
.scale span.on{font-weight:800}
.scale span.on.나쁨{background:var(--bad-bg);color:var(--bad);outline:2px solid var(--bad)}

.sum{list-style:none;padding:0;margin:0}
.sum li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sum li:last-child{border-bottom:0}
.sum .k{flex:none;width:64px;color:var(--mut);font-size:.85rem;padding-top:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.m{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--bg)}
.m .t{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.85rem}
.m .v{font-size:1.5rem;font-weight:800;margin:4px 0}
.m .d{font-size:.82rem;color:var(--mut)}
.m .tag{font-weight:700}
.ok .tag,.ok .v{color:var(--good)}.ng .tag,.ng .v{color:var(--bad)}.na .v{color:var(--mut)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}

td.sp{width:90px;text-align:center}
.err{display:flex;gap:12px;align-items:flex-start}

.cand{margin-top:10px}
.mut{color:var(--mut);font-size:.85rem;font-weight:400}
.pred{display:grid;gap:10px}
.pl{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:3px}
.pr.on .pl{font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:currentColor}
.pr.좋음{color:var(--good);background:none}.pr.주의{color:var(--warn);background:none}.pr.나쁨{color:var(--bad);background:none}

.note{color:var(--mut);font-size:.8rem;margin-top:8px}

const NAMES=Object.keys(DATA);
const ok=v=>v!=null&&isFinite(v);
const pct=n=>ok(n)?n.toFixed(1)+"%":"–";
const fmt=n=>ok(n)?Math.round(n).toLocaleString("ko-KR"):"–";
const div=(a,b)=>ok(a)&&ok(b)&&b>0?a/b*100:null;
const last=a=>a[a.length-1];

// 등급 규칙 (최근 연도 기준)
// 좋음: 유동비율>=150 & 영업이익률>=5 & 부채비율<=100 / 나쁨: 영업이익률<0 또는 (유동비율<100 & 부채비율>200) / 그 외 주의
function gradeOf(debt,cur,mar){
  if(![debt,cur,mar].every(ok))return LEVELS.HOLD;
  if(mar<0||(cur<100&&debt>200))return LEVELS.BAD;
  if(cur>=150&&mar>=5&&debt<=100)return LEVELS.GOOD;
  return LEVELS.MID;
}

function find(q){
  const n=norm(q); if(!n)return {list:[]};
  const al=Object.keys(ALIAS).find(k=>norm(k)===n);
  if(al)return {list:[ALIAS[al]]};
  const exact=NAMES.filter(k=>norm(k)===n||DATA[k].c===n);
  if(exact.length)return {list:exact};
  const pre=NAMES.filter(k=>norm(k).startsWith(n));
  if(pre.length)return {list:pre};
  return {list:NAMES.filter(k=>norm(k).includes(n))};
}

function analyze(name){
  const d=DATA[name], n=d.y.length-1;
  const mar=d.o.map((o,i)=>div(o,d.r[i])), cur=d.ca.map((c,i)=>div(c,d.cl[i])), debt=d.l.map((l,i)=>div(l,d.e[i]));
  const level=gradeOf(last(debt),last(cur),last(mar));
  const rv=d.r.filter(ok), ni=d.n.filter(ok);
  const cagr=rv.length>1&&rv[0]>0?(Math.pow(last(rv)/rv[0],1/(rv.length-1))-1)*100:null;
  const items=[
   {t:"부채비율",v:last(debt),c:"100% 이하",pass:ok(last(debt))&&last(debt)<=100},
   {t:"유동비율",v:last(cur),c:"150% 이상",pass:ok(last(cur))&&last(cur)>=150},
   {t:"영업이익률",v:last(mar),c:"5% 이상",pass:ok(last(mar))&&last(mar)>=5}];
  const info={cagr,profit:ni.filter(x=>x>0).length,niCount:ni.length,loss:d.o.filter(x=>ok(x)&&x<0).length,
    debtFirst:debt.find(ok),debtLast:last(debt),curLast:last(cur),marLast:last(mar),
    revFirst:rv[0],revLast:last(rv),yearFirst:d.y[0],yearLast:last(d.y),count:d.y.length};
  return {name,code:d.c,level,items,info,years:d.y,ofs:!!d.ofs,
    rows:[["매출",d.r],["영업이익",d.o],["순이익",d.n],["자산",d.a],["부채",d.l],["자본",d.e]]};
}

// 규칙 기반 요약 (외부 API 불필요)
function summarize(r){
  const i=r.info, out=[];
  if(r.level===LEVELS.HOLD){
    out.push(["등급","유동자산·유동부채 등 판정에 필요한 지표가 공시 데이터에 없어(금융업 등) 등급을 보류했습니다."]);
  }else if(r.level===LEVELS.GOOD){
    out.push(["등급","유동비율·영업이익률·부채비율이 모두 좋음 기준을 충족했습니다."]);
  }else if(r.level===LEVELS.BAD){
    const w=[];
    if(i.marLast<0)w.push(`영업이익률이 ${pct(i.marLast)}로 영업적자 상태`);
    if(i.curLast<100&&i.debtLast>200)w.push(`유동비율 ${pct(i.curLast)}(100% 미만)이면서 부채비율 ${pct(i.debtLast)}(200% 초과)`);
    out.push(["등급","나쁨 조건에 해당합니다: "+w.join(", ")+"."]);
  }else{
    const miss=r.items.filter(x=>!x.pass).map(x=>`${x.t} ${pct(x.v)}(기준 ${x.c})`);
    out.push(["등급","나쁨 조건은 아니지만 좋음 기준에 못 미칩니다: "+miss.join(", ")+"."]);
  }
  if(i.revFirst>0&&i.cagr!=null){
    const dir=i.cagr>=3?"성장":i.cagr>=0?"정체":"감소";
    out.push(["성장성",`매출 ${i.yearFirst}년 ${fmt(i.revFirst)}억 → ${i.yearLast}년 ${fmt(i.revLast)}억 (연평균 ${i.cagr.toFixed(1)}%, ${dir}).`]);
  }
  if(ok(i.marLast))out.push(["수익성",`최근 영업이익률 ${pct(i.marLast)}`+(i.loss?`, ${i.count}년 중 영업적자 ${i.loss}년.`:`, 영업적자 연도 없음.`)]);
  if(i.niCount)out.push(["흑자",`순이익 흑자 ${i.profit}/${i.niCount}년.`]);
  if(ok(i.debtFirst)&&ok(i.debtLast)&&i.count>1){
    const df=i.debtLast-i.debtFirst, dir=Math.abs(df)<5?"비슷한 수준":df>0?"상승":"하락";
    out.push(["안정성",`부채비율 ${pct(i.debtFirst)} → ${pct(i.debtLast)} (${dir}).`]);
  }
  if(i.count<5)out.push(["참고",`공시 데이터가 ${i.count}개년뿐이라 5개년 전체 추세는 아닙니다.`]);
  if(r.ofs)out.push(["참고","연결 재무제표가 없어 별도 재무제표 기준입니다."]);
  return out;
}

function spark(a){
  const v=a.filter(ok); if(!v.length)return "";
  const w=80,h=24,min=Math.min(...v,0),max=Math.max(...v,0),rg=max-min||1,bw=w/a.length,z=h-(0-min)/rg*h;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="추세">`+
   a.map((x,i)=>{if(!ok(x))return "";const y=h-(x-min)/rg*h,top=Math.min(y,z),ht=Math.max(Math.abs(y-z),1.5);
    return `<rect x="${i*bw+1.5}" y="${top}" width="${bw-3}" height="${ht}" rx="1.5" fill="${x<0?'var(--bad)':'var(--brand)'}"/>`}).join("")+`</svg>`;
}

// 다음 해 예측 카드. 2024년 등급이 보류인 기업은 예측 대상이 아님
function predCard(r){
  const m=PRED.meta||{}, p=(PRED.p||{})[r.name];
  if(!p)return `<section class="card"><h2>${m.year||""}년 예측</h2><p class="mut">등급이 보류된 기업은 예측 대상에서 제외됩니다.</p></section>`;
  const L=["좋음","주의","나쁨"], top=p.indexOf(Math.max(...p));
  return `<section class="card"><h2>${m.year}년 위험 예측 <span class="mut">(랜덤포레스트)</span></h2>
   <div class="pred">${L.map((l,i)=>`<div class="pr ${l}${i===top?' on':''}"><div class="pl"><span>${l}${i===top?' · 예측':''}</span><b>${p[i]}%</b></div><div class="bar"><i style="width:${p[i]}%"></i></div></div>`).join("")}</div>
   <p class="note">2023→2024 검증 정확도 약 ${m.acc}%이며, 나쁨 등급을 놓치는 경우가 많아 나쁨 확률이 낮아도 안전하다는 뜻은 아닙니다. 참고용 통계 예측입니다.</p></section>`;
}

function render(r){
  if(!r){$("out").innerHTML="";return}
  if(r.error){
    const c=(r.cands||[]).map(n=>`<button type="button" class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("");
    $("out").innerHTML=`<div class="card err"><span class="ic">⚠</span><div>${esc(r.error)}${c?`<div class="chips cand">${c}</div>`:""}</div></div>`;return}
  const ths=r.years.map(y=>`<th>${y}</th>`).join("");
  const rows=r.rows.map(([k,a])=>`<tr><td>${k}</td>${a.map(x=>`<td class="${ok(x)&&x<0?'neg':''}">${fmt(x)}</td>`).join("")}<td class="sp">${spark(a)}</td></tr>`).join("");
  const cards=r.items.map(x=>`<div class="m ${ok(x.v)?(x.pass?'ok':'ng'):'na'}"><div class="t"><span>${x.t}</span><span class="tag">${ok(x.v)?(x.pass?'✓ 좋음 기준 충족':'✕ 좋음 기준 미달'):'데이터 없음'}</span></div><div class="v">${pct(x.v)}</div><div class="d">좋음 기준: ${x.c}</div></div>`).join("")
   +`<div class="m na"><div class="t"><span>매출 성장률 (CAGR)</span></div><div class="v">${pct(r.info.cagr)}</div><div class="d">참고 지표 (등급에 미반영)</div></div>`
   +`<div class="m na"><div class="t"><span>순이익 흑자 연수</span></div><div class="v">${r.info.niCount?r.info.profit+"/"+r.info.niCount+"년":"–"}</div><div class="d">참고 지표 (등급에 미반영)</div></div>`;
  $("out").innerHTML=`
  <section class="card"><div class="hero">
    <div class="badge ${r.level}"><span class="ic" aria-hidden="true">${ICON[r.level]}</span>${r.level==="보류"?"판정 보류":r.level}</div>
    <div class="meta"><div class="name">${esc(r.name)}<span class="code">${esc(r.code)}</span></div>
      <div class="yr">${r.info.yearLast}년 기준 · ${r.info.count}개년 분석</div>
      <div class="scale" role="img" aria-label="등급 ${r.level}">${["나쁨","주의","좋음"].map(l=>`<span class="${l} ${l===r.level?'on':''}">${l}</span>`).join("")}</div></div>
  </div></section>
  ${predCard(r)}
  <section class="card"><h2>분석 요약</h2><ul class="sum">${summarize(r).map(([k,t])=>`<li><span class="k">${k}</span><span>${esc(t)}</span></li>`).join("")}</ul></section>
  <section class="card"><h2>판단 근거 (${r.info.yearLast}년)</h2><div class="grid">${cards}</div></section>
  <section class="card"><h2>5개년 재무 (억원)</h2><div class="wrap"><table>
    <tr><th>항목</th>${ths}<th style="text-align:center">추세</th></tr>${rows}</table></div></section>`;
}

function renderHist(h){
  $("hist").innerHTML=(h&&h.length?'<span class="lbl">최근 조회</span>':'')+(h||[]).map(n=>`<button type="button" class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("");
}

function run(q){
  q=q.trim(); if(!q)return;
  const s=load(), {list}=find(q);
  if(list.length===1){
    const name=list[0]; s.result=analyze(name);
    s.hist=[name,...(s.hist||[]).filter(x=>x!==name)].slice(0,8);
  }else if(list.length>1){
    s.result={error:`"${q}"에 해당하는 기업이 ${list.length}개입니다. 선택해 주세요.`,cands:list.slice(0,12)};
  }else{
    s.result={error:`"${q}" 데이터가 없습니다. KOSPI 시총 상위 ${NAMES.length}개 기업만 지원합니다.`};
  }
  s.q=q; save(s); render(s.result); renderHist(s.hist);
}

$("names").innerHTML=NAMES.map(n=>`<option value="${esc(n)}">`).join("");
$("f").onsubmit=e=>{e.preventDefault();run($("q").value)};
const pickChip=e=>{const b=e.target.closest&&e.target.closest("[data-n]");if(b){$("q").value=b.dataset.n;run(b.dataset.n)}};
$("hist").onclick=pickChip; $("out").onclick=pickChip;
const s=load(); $("q").value=s.q||"삼성전자"; render(s.result); renderHist(s.hist);
if(!s.result) run("삼성전자");
</script>
</body>
</html>
